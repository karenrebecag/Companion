name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR: a new commit cancels the superseded run. Push to main falls back to
# run_id, so main runs never share a group and are never cancelled or
# replaced: tsan counts clean main runs before it becomes required
# (docs/specs/tsan-gate.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    # The compliance suite is the contract: build, static checks, layer rules
    # and tests. Same script contributors run locally, no CI-only pipeline.
    # macos-26 (arm64): its default Xcode ships the Swift 6.2+ that
    # Package.swift requires; macos-15/Xcode 16.4 tops out at 6.1 and the
    # build died before running a single gate (20 red runs, same cause).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Show toolchain
        run: swift --version
      - name: Run gates
        run: scripts/gates.sh

  tsan:
    # ThreadSanitizer over the full suite, on its own runner so its build
    # never overwrites the debug binaries the gates job tests. Only TSan
    # reproduced the bridge and ClassicRuntime races (docs/specs/tsan-gate.md).
    # Informational until 5 clean runs in a row; then continue-on-error goes
    # and tsan joins gates as a required check. No path filter: a skipped
    # job counts as passing in a required check.
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Show toolchain
        run: swift --version
      - name: Run ThreadSanitizer
        run: scripts/tsan.sh
