name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# PR: a new commit cancels the superseded run. Push to main falls back to
# run_id, so main runs never share a group and are never cancelled or
# replaced: tsan counts clean main runs before it becomes required
# (docs/specs/tsan-gate.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    # The nightly run only exists for tsan and the quarantined timing tests.
    if: github.event_name != 'schedule'
    # The compliance suite is the contract: build, static checks, layer rules
    # and tests. Same script contributors run locally, no CI-only pipeline.
    # macos-26 (arm64): its default Xcode ships the Swift 6.2+ that
    # Package.swift requires; macos-15/Xcode 16.4 tops out at 6.1 and the
    # build died before running a single gate (20 red runs, same cause).
    runs-on: macos-26
    # A healthy run takes 9-14 min (44 runs on 2026-10-04); a hung test held
    # the runner 6 h (run 37180243632) and stalled every PR behind it. 30 min
    # is twice the slowest healthy run. gates.sh kills a silent swift test
    # first, so this only catches a hang outside Gate 4.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Gate 0 diffs against origin/$GITHUB_BASE_REF; a shallow clone lacks it.
          fetch-depth: 0
      - name: CompanionUIPro access
        uses: ./.github/actions/uipro-ssh
        with:
          deploy-key: ${{ secrets.UIPRO_DEPLOY_KEY }}
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          # Package.resolved pins the dependency graph; a stale .build for a
          # changed graph is rebuilt by SwiftPM, never trusted blindly.
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Show toolchain
        run: swift --version
      - name: Run gates
        run: scripts/gates.sh
      - name: Process waits under a strict cooperative pool
        # One pool thread per QoS bucket, so a wait that parks its thread
        # starves the second shell of testTheWaitDoesNotBlockTheCaller.
        # Filtered: the suite's semaphore helpers would hang a full run here.
        # The variable only takes effect at process start, hence env:. A filter
        # that matches nothing still exits 0, so the run must report one test;
        # cooperative queues switched off would let a blocking wait pass.
        # docs/research/tests-espera-sin-hilo.md
        timeout-minutes: 5
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: 1
        run: |
          set -o pipefail
          unset SWIFT_DEBUG_CONCURRENCY_ENABLE_COOPERATIVE_QUEUES
          swift test --skip-build --filter processGroupTests 2>&1 | tee strict-pool.log
          grep -q "Test run with 1 test" strict-pool.log

  tsan:
    # Nightly and manual only: a PR does not wait on a 45 min sanitizer build.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ThreadSanitizer over the full suite, on its own runner so its build
    # never overwrites the debug binaries the gates job tests. Only TSan
    # reproduced the bridge and ClassicRuntime races (docs/specs/tsan-gate.md).
    # Informational until 5 clean runs in a row; then continue-on-error goes
    # and tsan joins gates as a required check. No path filter: a skipped
    # job counts as passing in a required check.
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: CompanionUIPro access
        uses: ./.github/actions/uipro-ssh
        with:
          deploy-key: ${{ secrets.UIPRO_DEPLOY_KEY }}
      - name: Show toolchain
        run: swift --version
      - name: Run ThreadSanitizer
        run: scripts/tsan.sh

  quarantined-timing:
    # Wall-clock tests are skipped in gates (docs/inventario-flakes.md); this
    # keeps them running, off the required path, so a real regression shows up.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    env:
      COMPANION_FLAKY_QUARANTINE_OFF: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: CompanionUIPro access
        uses: ./.github/actions/uipro-ssh
        with:
          deploy-key: ${{ secrets.UIPRO_DEPLOY_KEY }}
      - name: Show toolchain
        run: swift --version
      - name: Run quarantined timing tests
        run: >
          swift test --no-parallel
          --filter 'aHelloInsideTheDeadlineIsNotClosedLater|diagramSchedulerCancellationTests|diagramSchedulerTimeoutTests|diagramPageFailureTests|dm1cGateTimesOutWithinBudgetWhenTheProviderIsSlow'
